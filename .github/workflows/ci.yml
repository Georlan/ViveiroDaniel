name: Quality Gate

on:
  push:
    branches: [main, feat/mobile-first-mvp]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Test formulas
        run: npm test

      - name: Build
        run: npm run build
